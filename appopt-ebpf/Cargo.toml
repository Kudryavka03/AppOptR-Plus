[package]
name = "AppOpt-ebpf"
version = "0.3.1"
edition = "2024"

[[bin]]
name = "AppOpt-ebpf"
path = "src/main.rs"

[dependencies]
aya-ebpf = "0.2"

[profile.release]
# Recent bpf-linker/LLVM no longer accepts the legacy -Os flag.  O2 is the
# compatible BPF optimization level; the ELF is still stripped by packaging.
opt-level = 2
lto = true
debug = false
codegen-units = 1
